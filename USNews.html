<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Market Brief</title>
  <style>
    :root { --bg: #0f1115; --card: #181b22; --text: #e6e8ec; --muted: #8b92a0; --up: #22c55e; --dn: #ef4444; --border: #262b36; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 14px; max-width: 640px; margin: auto; line-height: 1.45; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    h1 { font-size: 1.15rem; font-weight: 700; }
    .meta { font-size: 0.78rem; color: var(--muted); }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 7px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    button:active { opacity: 0.8; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .card h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 8px; }
    ul.summary { padding-left: 16px; font-size: 0.92rem; }
    ul.summary li { margin-bottom: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    td { padding: 7px 2px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .up { color: var(--up); font-weight: 600; }
    .dn { color: var(--dn); font-weight: 600; }
    .news a { display: block; color: var(--text); text-decoration: none; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .news a:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Morning Market Brief</h1>
      <div class="meta" id="updated">Loading...</div>
    </div>
    <button onclick="loadBrief()">Refresh</button>
  </header>

  <div class="card">
    <h2>Overnight Synthesis</h2>
    <ul class="summary" id="summary"></ul>
  </div>

  <div class="card">
    <h2>Indices & Macro</h2>
    <table><tbody id="indices"></tbody></table>
  </div>

  <div class="card">
    <h2>Headlines</h2>
    <div class="news" id="headlines"></div>
  </div>

  <script>
    async function loadBrief() {
      const t0 = performance.now();
      const res = await fetch(`brief.json?t=${Date.now()}`, { cache: "no-store" });
      const data = await res.json();
      const ms = Math.round(performance.now() - t0);

      document.getElementById("updated").textContent = `${data.updated_sgt} (${ms}ms)`;
      document.getElementById("summary").innerHTML = data.summary.map(s => `<li>${s}</li>`).join("");
      document.getElementById("indices").innerHTML = data.indices.map(i => {
        const cls = i.pct >= 0 ? "up" : "dn";
        const sign = i.pct >= 0 ? "+" : "";
        return `<tr><td>${i.name}</td><td class="num">${i.price.toLocaleString()}</td><td class="num ${cls}">${sign}${i.pct.toFixed(2)}%</td></tr>`;
      }).join("");
      document.getElementById("headlines").innerHTML = data.headlines.map(h => `<a href="${h.link}" target="_blank" rel="noopener">${h.title}</a>`).join("");
    }
    loadBrief();
  </script>
</body>
</html>
